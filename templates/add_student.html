{% extends 'base.html' %}
{% block content %}
<h1>Add Student</h1>
<form method="post">
  <label>First Name<input name="first_name" value="{{ request.form.get('first_name', '') }}" required></label>
  <label>Last Name<input name="last_name" value="{{ request.form.get('last_name', '') }}" required></label>
  <button type="submit">Add Student</button>
</form>
{% endblock %}
