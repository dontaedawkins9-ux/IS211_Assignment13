{% extends 'base.html' %}
{% block content %}
<h1>Quiz Results: {{ student.first_name }} {{ student.last_name }}</h1>
{% if results %}
<table><tr><th>Quiz ID</th><th>Score</th></tr>
{% for result in results %}<tr><td>{{ result.quiz_id }}</td><td>{{ result.score }}</td></tr>{% endfor %}
</table>
{% else %}<p>No Results</p>{% endif %}
{% endblock %}
